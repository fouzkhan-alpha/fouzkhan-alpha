<svg xmlns="http://www.w3.org/2000/svg" width="168" height="52" viewBox="0 0 168 52">
<defs>
<linearGradient id="gportfolio" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#00C7B7"/><stop offset="1" stop-color="#0077FF"/>
</linearGradient>
<linearGradient id="shportfolio" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="glportfolio" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00C7B7" flood-opacity="0.55"/>
</filter>
<clipPath id="clportfolio"><rect x="3" y="3" width="162" height="46" rx="23"/></clipPath>
</defs>
<rect x="3" y="3" width="162" height="46" rx="23" fill="url(#gportfolio)" filter="url(#glportfolio)"/>
<rect x="3" y="3" width="162" height="22" rx="11" fill="#fff" opacity="0.12"/>
