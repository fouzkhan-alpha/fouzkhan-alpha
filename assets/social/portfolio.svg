<rect x="-50" y="0" width="44" height="52" fill="url(#shportfolio)" transform="skewX(-18)">
<animate attributeName="x" values="-50;200" dur="2.8s" begin="1.0s" repeatCount="indefinite"/>
</rect>
</g>
<g transform="translate(20,26)"><polygon points="0,-10 8.7,-5 8.7,5 0,10 -8.7,5 -8.7,-5" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="0" cy="0" r="2.5" fill="#fff"/></g>
<text x="52" y="32" font-family="Verdana,Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff" letter-spacing="1">Portfolio</text>
</svg>