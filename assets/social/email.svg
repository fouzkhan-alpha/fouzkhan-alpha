<svg xmlns="http://www.w3.org/2000/svg" width="168" height="52" viewBox="0 0 168 52">
<defs>
<linearGradient id="gemail" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#00D563"/><stop offset="1" stop-color="#00A651"/>
</linearGradient>
<linearGradient id="shemail" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="glemail" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#00D563" flood-opacity="0.55"/>
</filter>
<clipPath id="clemail"><rect x="3" y="3" width="162" height="46" rx="23"/></clipPath>
</defs>
<rect x="3" y="3" width="162" height="46" rx="23" fill="url(#gemail)" filter="url(#glemail)"/>
<rect x="3" y="3" width="162" height="22" rx="11" fill="#fff" opacity="0.12"/>
<g clip-path="url(#clemail)">
<rect x="-50" y="0" width="44" height="52" fill="url(#shemail)" transform="skewX(-18)">
<animate attributeName="x" values="-50;200" dur="2.8s" begin="2.0s" repeatCount="indefinite"/>
</rect>
</g>
<g transform="translate(20,26)"><rect x="-10" y="-7" width="20" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/><polyline points="-10,-7 0,2 10,-7" fill="none" stroke="#fff" stroke-width="2.5"/></g>
<text x="52" y="32" font-family="Verdana,Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff" letter-spacing="1">Email</text>
</svg>