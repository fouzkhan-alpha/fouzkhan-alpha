<svg xmlns="http://www.w3.org/2000/svg" width="168" height="52" viewBox="0 0 168 52">
<defs>
<linearGradient id="glinkedin" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0A66C2"/><stop offset="1" stop-color="#00A0DC"/>
</linearGradient>
<linearGradient id="shlinkedin" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="gllinkedin" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A66C2" flood-opacity="0.55"/>
</filter>
<clipPath id="cllinkedin"><rect x="3" y="3" width="162" height="46" rx="23"/></clipPath>
</defs>
<rect x="3" y="3" width="162" height="46" rx="23" fill="url(#glinkedin)" filter="url(#gllinkedin)"/>
<rect x="3" y="3" width="162" height="22" rx="11" fill="#fff" opacity="0.12"/>
<g clip-path="url(#cllinkedin)">
<rect x="-50" y="0" width="44" height="52" fill="url(#shlinkedin)" transform="skewX(-18)">
<animate attributeName="x" values="-50;200" dur="2.8s" begin="0s" repeatCount="indefinite"/>
</rect>
</g>
<g transform="translate(20,26)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#fff"/><text x="0" y="5" font-family="Arial" font-size="12" font-weight="900" fill="#0A66C2" text-anchor="middle">in</text></g>
<text x="52" y="32" font-family="Verdana,Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff" letter-spacing="1">LinkedIn</text>
</svg>