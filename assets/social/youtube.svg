<svg xmlns="http://www.w3.org/2000/svg" width="168" height="52" viewBox="0 0 168 52">
<defs>
<linearGradient id="gyoutube" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FF0000"/><stop offset="1" stop-color="#CC0000"/>
</linearGradient>
<linearGradient id="shyoutube" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="glyoutube" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#FF0000" flood-opacity="0.55"/>
</filter>
<clipPath id="clyoutube"><rect x="3" y="3" width="162" height="46" rx="23"/></clipPath>
</defs>
<rect x="3" y="3" width="162" height="46" rx="23" fill="url(#gyoutube)" filter="url(#glyoutube)"/>
<rect x="3" y="3" width="162" height="22" rx="11" fill="#fff" opacity="0.12"/>
<g clip-path="url(#clyoutube)">
<rect x="-50" y="0" width="44" height="52" fill="url(#shyoutube)" transform="skewX(-18)">
<animate attributeName="x" values="-50;200" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
</rect>
</g>
<g transform="translate(20,26)"><circle cx="0" cy="0" r="10" fill="#fff"/><polygon points="-3.5,-5 6,0 -3.5,5" fill="#FF0000"/></g>
<text x="52" y="32" font-family="Verdana,Arial,sans-serif" font-size="15" font-weight="bold" fill="#fff" letter-spacing="1">YouTube</text>
</svg>