<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="auto" fill="none">
<defs><style>
@keyframes radarExpand { 0% { transform: scale(0.1); opacity: 0; } 70% { transform: scale(1.04); opacity: 0.95; } 100% { transform: scale(1); opacity: 1; } }
@keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes vertexPop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes barGrow { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
@keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes glowPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
.radar-poly { transform-origin: 280px 210px; animation: radarExpand 1.1s cubic-bezier(0.16,1,0.3,1) 0.2s forwards; opacity: 0; }
.radar-sweep { transform-origin: 280px 210px; animation: radarSweep 9s linear infinite; }
.vertex-dot { transform-box: fill-box; transform-origin: center; opacity: 0; animation: vertexPop 0.4s ease-out forwards; }
.hud-bar { transform-origin: left center; animation: barGrow 0.9s cubic-bezier(0.16,1,0.3,1) forwards; }
.fade-late { opacity: 0; animation: fadeIn 0.8s ease-out forwards; }
.pulse-glow { animation: glowPulse 2.5s ease-in-out infinite; }
</style>
<linearGradient id="polyFill2" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#00ff88" stop-opacity="0.5"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0.3"/>
</linearGradient>
