<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="dline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="120" y="11" width="960" height="2" fill="url(#dline)"/>
  <circle cx="120" cy="12" r="5" fill="#00ff88" filter="url(#dglow)">
    <animate attributeName="cx" values="120;1080;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00ff88;#58a6ff;#00ff88" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="12" r="2" fill="#ffffff" opacity="0.9">
    <animate attributeName="cx" values="120;1080;120" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
