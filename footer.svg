<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <linearGradient id="ftext" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#58a6ff;#00ff88" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#00ff88;#58a6ff" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="forb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="170" fill="url(#fbg)"/>
  <ellipse cx="600" cy="170" rx="420" ry="110" fill="url(#forb)">
    <animate attributeName="cx" values="600;520;600" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <g font-family="'Courier New', Courier, monospace" text-anchor="middle">
    <text x="600" y="70" font-size="34" font-weight="bold" fill="url(#ftext)" filter="url(#fglow)" letter-spacing="10">THANKS FOR VISITING</text>
    <text x="600" y="110" font-size="17" fill="#8b949e" letter-spacing="3">let's build something amazing together</text>
    <text x="600" y="142" font-size="14" fill="#00ff88" opacity="0.85">&gt; end_of_transmission
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="#00ff88" opacity="0.6">
    <circle cx="300" cy="150" r="2.5">
      <animate attributeName="cy" values="150;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="150" r="2.5" fill="#58a6ff">
      <animate attributeName="cy" values="150;60" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="160" r="2">
      <animate attributeName="cy" values="160;70" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="5.5s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
